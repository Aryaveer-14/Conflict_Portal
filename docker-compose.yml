##
## docker-compose.yml
## -------------------
## Full MERN stack: MongoDB + Express (Node.js) + React/Vite
## Run with:  docker-compose up --build
##
## Services:
##   mongo    → mongodb://localhost:27017
##   server   → http://localhost:8000  (Express API)
##   frontend → http://localhost:5173  (React/Vite)
##

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: gcip

  # ── Express.js Backend ───────────────────────────────────────────────────────
  server:
    build:
      context: ./server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/gcip
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - mongo

  # ── React/Vite Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - server

volumes:
  mongo_data:
    driver: local
